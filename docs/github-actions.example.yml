# To enable CI, copy this file to .github/workflows/tests.yml using a
# GitHub credential with workflow permission.
name: Tests and package
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'qwenpaw==2.2.1' pytest pytest-asyncio
      - run: python -m pytest tests -q
      - run: python scripts/build_card.py && git diff --exit-code cards/
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: dingtalk-ai
          path: dist/*
